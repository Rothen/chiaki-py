name: Build (Raspberry Pi)
# on:
#     push:
#         branches: [main]
#         tags-ignore:
#             - "**"
#     pull_request:
#     workflow_dispatch:
#     workflow_call:

on:
  workflow_dispatch:
  workflow_call:

jobs:
    build:
        name: Build wheel (linux_aarch64 for Raspberry Pi OS, cp311)
        # A native arm64 runner, but the build itself runs in Debian 12 (Bookworm), which is what 64-bit
        # Raspberry Pi OS is based on: its glibc (2.36) decides the manylinux tag auditwheel can give the
        # wheel, and one built on the runner's own Ubuntu 24.04 (glibc 2.39) would not install on a Pi.
        # Bookworm's Python is 3.11, the one version pyproject.toml allows.
        # Raspberry Pi 3/4/5 (and Zero 2 W) running a 64-bit OS only; 32-bit (armhf) Pi OS is not covered.
        runs-on: ubuntu-24.04-arm
        container: debian:bookworm

        defaults:
            run:
                shell: bash

        steps:
            - name: Install native dependencies
              env:
                  DEBIAN_FRONTEND: noninteractive
              run: |
                  apt-get update
                  apt-get install -y --no-install-recommends \
                      ca-certificates git file \
                      build-essential ninja-build cmake pkg-config nasm \
                      python3 python3-dev python3-venv \
                      protobuf-compiler libprotobuf-dev \
                      libopus-dev libjson-c-dev libminiupnpc-dev libpsl-dev libevdev-dev libevent-dev \
                      libgf-complete-dev libspeexdsp-dev libidn2-dev libnghttp2-dev libssh2-1-dev \
                      libfmt-dev libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libavdevice-dev \
                      libsdl2-dev libhidapi-dev libssl-dev libfftw3-dev liblcms2-dev libvulkan-dev zlib1g-dev

            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Trust the checkout
              # The workspace is owned by the runner's user, not the container's root; without this git
              # refuses to read the repo, and setuptools-scm finds no version.
              run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

            - name: Set up Python build/CI tooling
              # Bookworm's Python is externally managed (PEP 668), so the tooling goes into a venv.
              run: |
                  python3 -m venv "$RUNNER_TEMP/venv"
                  echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
                  "$RUNNER_TEMP/venv/bin/python" -m pip install --upgrade pip
                  "$RUNNER_TEMP/venv/bin/python" -m pip install --upgrade protobuf build twine pybind11_stubgen auditwheel patchelf

            - name: Configure
              run: |
                  python --version
                  cmake --fresh -S . -B build-release -G Ninja -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
                    -DCMAKE_BUILD_TYPE=Release \
                    -DCMAKE_C_COMPILER=/usr/bin/gcc -DCMAKE_CXX_COMPILER=/usr/bin/g++ \
                    -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
                    -DPython3_EXECUTABLE="$(which python)" -DPython_EXECUTABLE="$(which python)" -DPYTHON_EXECUTABLE="$(which python)"

            - name: Build chiaki-py
              run: cmake --build build-release --config Release --target chiaki-py -- -j"$(nproc)"

            - name: Build wheel
              run: python -m build --wheel --outdir wheelhouse-raw

            - name: Repair wheel (bundle shared libraries, manylinux tag)
              run: |
                  auditwheel show wheelhouse-raw/*.whl
                  auditwheel repair wheelhouse-raw/*.whl --wheel-dir dist

            - name: Check distributions
              run: python -m twine check dist/*

            - name: Smoke test wheel
              working-directory: ${{ runner.temp }}
              run: |
                  python3 -m venv smoke-venv
                  smoke-venv/bin/python -m pip install --no-deps "$GITHUB_WORKSPACE"/dist/*.whl
                  smoke-venv/bin/python -m pip install numpy pydantic
                  smoke-venv/bin/python -c "import chiaki_py.lib as lib; print(lib.__file__); assert 'site-packages' in lib.__file__"
                  so=$(echo smoke-venv/lib/python3.11/site-packages/chiaki_py/lib/chiaki_py.*.so)
                  file "$so"
                  if ldd "$so" | grep "not found"; then
                      echo "::error::$so has unresolved shared libraries"
                      exit 1
                  fi

            - uses: actions/upload-artifact@v4
              with:
                  name: dist-raspberrypi
                  path: dist/
                  if-no-files-found: error
