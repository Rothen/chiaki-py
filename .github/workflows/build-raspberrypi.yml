name: Build (Raspberry Pi)
# on:
#     push:
#         branches: [main]
#         tags-ignore:
#             - "**"
#     pull_request:
#     workflow_dispatch:
#     workflow_call:

on:
  workflow_dispatch:
  workflow_call:

jobs:
    build:
        name: Build wheel (linux_aarch64 for Raspberry Pi OS, cp311)
        # A native arm64 runner, but the build itself runs in Debian 12 (Bookworm), which is what 64-bit
        # Raspberry Pi OS is based on: its glibc (2.36) decides the manylinux tag auditwheel can give the
        # wheel, and one built on the runner's own Ubuntu 24.04 (glibc 2.39) would not install on a Pi.
        # Bookworm's Python is 3.11, the one version pyproject.toml allows.
        # Raspberry Pi 3/4/5 (and Zero 2 W) running a 64-bit OS only; 32-bit (armhf) Pi OS is not covered.
        runs-on: ubuntu-24.04-arm
        container: debian:bookworm
        env:
            # Bookworm's FFmpeg (5.1, also what Raspberry Pi OS ships) is too old for chiaki-ng, which needs
            # AVFrame.duration (FFmpeg 6.0+), so a newer one is built here and auditwheel bundles it into the
            # wheel. Only what chiaki-py uses: the H.264/HEVC software decoders and swscale. LGPL, no --enable-gpl.
            FFMPEG_VERSION: "7.1.1"
            FFMPEG_PREFIX: /opt/ffmpeg

        defaults:
            run:
                shell: bash

        steps:
            - name: Install native dependencies
              env:
                  DEBIAN_FRONTEND: noninteractive
              run: |
                  apt-get update
                  apt-get install -y --no-install-recommends \
                      ca-certificates git file curl xz-utils \
                      build-essential ninja-build cmake pkg-config \
                      python3 python3-dev python3-venv \
                      protobuf-compiler libprotobuf-dev \
                      libopus-dev libjson-c-dev libminiupnpc-dev libpsl-dev libevdev-dev libevent-dev \
                      libgf-complete-dev libspeexdsp-dev libidn2-dev libnghttp2-dev libssh2-1-dev \
                      libfmt-dev \
                      libsdl2-dev libhidapi-dev libssl-dev libfftw3-dev liblcms2-dev libvulkan-dev zlib1g-dev

            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Trust the checkout
              # The workspace is owned by the runner's user, not the container's root; without this git
              # refuses to read the repo, and setuptools-scm finds no version.
              run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

            - name: Cache FFmpeg
              id: ffmpeg-cache
              uses: actions/cache@v4
              with:
                  path: ${{ env.FFMPEG_PREFIX }}
                  # Bump the trailing revision when the configure flags below change.
                  key: ffmpeg-${{ env.FFMPEG_VERSION }}-bookworm-arm64-r1

            - name: Build FFmpeg ${{ env.FFMPEG_VERSION }}
              if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
              working-directory: ${{ runner.temp }}
              run: |
                  curl -fsSL "https://ffmpeg.org/releases/ffmpeg-$FFMPEG_VERSION.tar.xz" | tar xJ
                  cd "ffmpeg-$FFMPEG_VERSION"
                  ./configure --prefix="$FFMPEG_PREFIX" \
                      --enable-shared --disable-static --enable-pic \
                      --disable-programs --disable-doc \
                      --disable-autodetect --enable-pthreads \
                      --disable-everything \
                      --disable-avdevice --disable-avfilter --disable-swresample \
                      --enable-decoder=h264,hevc --enable-parser=h264,hevc
                  make -j"$(nproc)"
                  make install

            - name: Point the build at FFmpeg
              # LD_LIBRARY_PATH too: the stub generator imports the module right after it is built, and
              # auditwheel has to find the libraries to bundle them.
              run: |
                  echo "PKG_CONFIG_PATH=$FFMPEG_PREFIX/lib/pkgconfig" >> "$GITHUB_ENV"
                  echo "LD_LIBRARY_PATH=$FFMPEG_PREFIX/lib" >> "$GITHUB_ENV"
                  PKG_CONFIG_PATH="$FFMPEG_PREFIX/lib/pkgconfig" pkg-config --modversion libavcodec libavformat libavutil libswscale

            - name: Set up Python build/CI tooling
              # Bookworm's Python is externally managed (PEP 668), so the tooling goes into a venv.
              run: |
                  python3 -m venv "$RUNNER_TEMP/venv"
                  echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
                  "$RUNNER_TEMP/venv/bin/python" -m pip install --upgrade pip
                  "$RUNNER_TEMP/venv/bin/python" -m pip install --upgrade protobuf build twine pybind11_stubgen auditwheel patchelf

            - name: Configure
              run: |
                  python --version
                  cmake --fresh -S . -B build-release -G Ninja -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
                    -DCMAKE_BUILD_TYPE=Release \
                    -DCMAKE_C_COMPILER=/usr/bin/gcc -DCMAKE_CXX_COMPILER=/usr/bin/g++ \
                    -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
                    -DPython3_EXECUTABLE="$(which python)" -DPython_EXECUTABLE="$(which python)" -DPYTHON_EXECUTABLE="$(which python)"

            - name: Build chiaki-py
              run: cmake --build build-release --config Release --target chiaki-py -- -j"$(nproc)"

            - name: Build wheel
              run: python -m build --wheel --outdir wheelhouse-raw

            - name: Repair wheel (bundle shared libraries, manylinux tag)
              run: |
                  auditwheel show wheelhouse-raw/*.whl
                  auditwheel repair wheelhouse-raw/*.whl --wheel-dir dist

            - name: Check distributions
              run: python -m twine check dist/*

            - name: Smoke test wheel
              working-directory: ${{ runner.temp }}
              run: |
                  # Only what the wheel bundles may be used here, not the FFmpeg build it was made from.
                  unset LD_LIBRARY_PATH
                  python3 -m venv smoke-venv
                  smoke-venv/bin/python -m pip install --no-deps "$GITHUB_WORKSPACE"/dist/*.whl
                  smoke-venv/bin/python -m pip install numpy pydantic
                  smoke-venv/bin/python -c "import chiaki_py.lib as lib; print(lib.__file__); assert 'site-packages' in lib.__file__"
                  # SDL's audio subsystem has to start from the bundled library; runners have no sound card, hence the dummy driver.
                  SDL_AUDIODRIVER=dummy smoke-venv/bin/python -c "from chiaki_py.lib import AudioOutput; print('audio devices:', AudioOutput.get_devices())"
                  so=$(echo smoke-venv/lib/python3.11/site-packages/chiaki_py/lib/chiaki_py.*.so)
                  file "$so"
                  if ldd "$so" | grep "not found"; then
                      echo "::error::$so has unresolved shared libraries"
                      exit 1
                  fi

            - uses: actions/upload-artifact@v4
              with:
                  name: dist-raspberrypi
                  path: dist/
                  if-no-files-found: error
