name: Build (Ubuntu)

# Builds the native extension + wheel/sdist on every push/PR (so a broken
# build is caught immediately). Also callable from other workflows
# (workflow_call) - see publish.yml, which calls this and build-windows.yml
# and only publishes once both report success.
#
# Mirrors scripts/build_chiaki_ubuntu.sh: links chiaki-ng and its
# dependencies from apt instead of vcpkg (see pybind/CMakeLists.txt's WIN32
# vs. non-WIN32 branches).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    name: Build wheel (linux_x86_64, cp311)
    runs-on: ubuntu-latest
    env:
      # requires-python in pyproject.toml is pinned to this same version -
      # the wheel this produces only works with the exact CPython ABI it
      # was built against. Bumping this requires also bumping
      # pyproject.toml's requires-python, and vice versa.
      PYTHON_VERSION: "3.11"

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python build/CI tooling
        run: |
          python -m pip install --upgrade pip
          # protobuf: nanopb's code generator (used building chiaki-ng's
          # protocol buffers) imports google.protobuf - without it present
          # on whichever Python CMake picks up, the build fails partway
          # through with a nanopb traceback, not a clear "missing dep" error.
          python -m pip install --upgrade protobuf build twine

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
              build-essential ninja-build cmake git pkg-config nasm \
              python3-dev pybind11_stubgen \
              protobuf-compiler libprotobuf-dev \
              libopus-dev libjson-c-dev libminiupnpc-dev libpsl-dev libevdev-dev \
              libgf-complete-dev libspeexdsp-dev libidn2-dev libnghttp2-dev libssh2-1-dev \
              libfmt-dev libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libavdevice-dev \
              libsdl2-dev libhidapi-dev libssl-dev libfftw3-dev liblcms2-dev libvulkan-dev zlib1g-dev

      - name: Configure
        run: |
          pythonExe="$(python -c 'import sys; print(sys.executable)')"
          # CMAKE_POLICY_VERSION_MINIMUM: chiaki-ng's own CMakeLists.txt pins
          # cmake_minimum_required(VERSION 3.2), which current CMake (>=4)
          # rejects outright without this fallback.
          cmake --fresh -S . -B build-release -G Ninja -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=/usr/bin/gcc -DCMAKE_CXX_COMPILER=/usr/bin/g++ \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DPYTHON_EXECUTABLE="$pythonExe"

      - name: Build chiaki-py
        run: cmake --build build-release --config Release --target chiaki-py -- -j"$(nproc)"

      - name: Build wheel + sdist
        run: python -m build

      - name: Check distributions
        run: python -m twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist-ubuntu
          path: dist/
          if-no-files-found: error
