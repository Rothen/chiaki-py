name: Build (Ubuntu)
# on:
#     push:
#         branches: [main]
#         tags-ignore:
#             - "**"
#     pull_request:
#     workflow_dispatch:
#     workflow_call:

on:
  workflow_dispatch:
  workflow_call:

jobs:
    build:
        name: Build wheel (linux_x86_64, Python ${{ matrix.python-version }})
        # Pinned rather than ubuntu-latest: auditwheel can only repair a wheel into a manylinux tag it
        # recognizes, and a too-new glibc (e.g. from ubuntu-latest tracking a very recent Ubuntu release)
        # fails with "too-recent versioned symbols". ubuntu-24.04 (glibc 2.39) is within auditwheel's
        # known manylinux policies.
        runs-on: ubuntu-24.04
        strategy:
            fail-fast: false
            matrix:
                python-version: ["3.11", "3.12", "3.13", "3.14"]
        env:
            PYTHON_VERSION: ${{ matrix.python-version }}

        defaults:
            run:
                shell: bash

        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Set up Python ${{ env.PYTHON_VERSION }}
              uses: actions/setup-python@v5
              with:
                  python-version: ${{ env.PYTHON_VERSION }}

            - name: Install Python build/CI tooling
              run: |
                  python -m pip install --upgrade pip
                  python -m pip install --upgrade protobuf build twine pybind11_stubgen

            - name: Install native dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y \
                      build-essential ninja-build cmake git pkg-config nasm \
                      python3-dev \
                      protobuf-compiler libprotobuf-dev \
                      libopus-dev libjson-c-dev libminiupnpc-dev libpsl-dev libevdev-dev libevent-dev \
                      libgf-complete-dev libspeexdsp-dev libidn2-dev libnghttp2-dev libssh2-1-dev \
                      libfmt-dev libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libavdevice-dev \
                      libsdl2-dev libhidapi-dev libssl-dev libfftw3-dev liblcms2-dev libvulkan-dev zlib1g-dev

            - name: Configure
              run: |
                  cmake --fresh -S . -B build-release -G Ninja -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
                    -DCMAKE_BUILD_TYPE=Release \
                    -DCMAKE_C_COMPILER=/usr/bin/gcc -DCMAKE_CXX_COMPILER=/usr/bin/g++ \
                    -DCMAKE_POSITION_INDEPENDENT_CODE=ON                     -DPython3_EXECUTABLE="$(which python)" -DPython_EXECUTABLE="$(which python)" -DPYTHON_EXECUTABLE="$(which python)"

            - name: Build chiaki-py
              run: cmake --build build-release --config Release --target chiaki-py -- -j"$(nproc)"

            - name: Build wheel
              run: python -m build --wheel --outdir wheelhouse-raw

            - name: Repair wheel (bundle shared libraries, manylinux tag)
              run: |
                  python -m pip install auditwheel patchelf
                  auditwheel show wheelhouse-raw/*.whl
                  auditwheel repair wheelhouse-raw/*.whl --wheel-dir dist

            - name: Check distributions
              run: python -m twine check dist/*

            - name: Smoke test wheel
              working-directory: ${{ runner.temp }}
              run: |
                  python -m venv smoke-venv
                  smoke-venv/bin/python -m pip install --no-deps "$GITHUB_WORKSPACE"/dist/*.whl
                  smoke-venv/bin/python -m pip install numpy pydantic
                  smoke-venv/bin/python -c "import chiaki_py.lib as lib; print(lib.__file__); assert 'site-packages' in lib.__file__"
                  # SDL's audio subsystem has to start from the bundled library; runners have no sound card, hence the dummy driver.
                  SDL_AUDIODRIVER=dummy smoke-venv/bin/python -c "from chiaki_py.lib import AudioOutput; print('audio devices:', AudioOutput.get_devices())"
                  site="$(smoke-venv/bin/python -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')"
                  ldd "$site"/chiaki_py/lib/chiaki_py.*.so

            - uses: actions/upload-artifact@v4
              with:
                  name: dist-ubuntu-${{ matrix.python-version }}
                  path: dist/
                  if-no-files-found: error
