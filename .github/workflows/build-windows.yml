name: Build (Windows)

# Builds the native extension + wheel/sdist on every push/PR (so a broken
# build is caught immediately). Also callable from other workflows
# (workflow_call) - see publish.yml, which calls this and build-ubuntu.yml
# and only publishes once both report success.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    name: Build wheel (win_amd64, cp311)
    runs-on: windows-latest
    env:
      # requires-python in pyproject.toml is pinned to this same version -
      # the wheel this produces only works with the exact CPython ABI it
      # was built against (cp311-win_amd64). Bumping this requires also
      # bumping pyproject.toml's requires-python, and vice versa.
      PYTHON_VERSION: "3.11"
      VCPKG_ROOT: ${{ github.workspace }}\vcpkg
      # Pinned (rather than always cloning master's tip) for reproducibility,
      # and so the vcpkg binary cache key below is tied to it: bumping this
      # invalidates old cached package binaries that were built by a
      # different vcpkg/CMake pairing, instead of silently reusing binaries
      # built by some other pairing.
      VCPKG_TAG: "2026.07.29"

    defaults:
      run:
        shell: powershell

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: "x64"

      - name: Install Python build/CI tooling
        run: |
          python -m pip install --upgrade pip
          # protobuf: nanopb's code generator (used building chiaki-ng's
          # protocol buffers) imports google.protobuf - without it present
          # on whichever Python CMake picks up, the build fails partway
          # through with a nanopb traceback, not a clear "missing dep" error.
          python -m pip install --upgrade protobuf build twine pybind11_stubgen

      - name: Set up Ninja
        run: choco install ninja --no-progress -y

      # Pinned rather than relying on whatever standalone CMake the runner
      # image happens to preinstall (windows-latest currently ships 4.4.3,
      # but that's an implicit dependency on the image, not something this
      # workflow controls - the same category of surprise-version drift as
      # clang below). choco's cmake.install package already adds itself to
      # the machine PATH, but that PATH update doesn't reach this already-
      # running job process, so add it to GITHUB_PATH explicitly too.
      - name: Set up CMake
        run: |
          choco install cmake --version=4.4.3 --installargs "ADD_CMAKE_TO_PATH=System" --no-progress -y --allow-downgrade --force
          echo "$env:ProgramFiles\CMake\bin" >> $env:GITHUB_PATH

      # egor-tensin/setup-clang@v1's Windows path (Install-Package llvm via
      # choco) ignores the requested "version" input entirely - it always
      # installs/upgrades to chocolatey's latest llvm package, so this used
      # to silently drift to whatever's newest (e.g. 22.1.8) regardless of
      # what's asked for here. That newest-at-the-time clang has had actual
      # miscompiles for us (clang 22.1.8 failed to see <intrin.h>'s
      # __cpuidex declaration while building chiaki-ng's vendored
      # gf-complete, even though the exact same source/flags compile clean
      # under clang 20) - so install a pinned, known-good version directly
      # instead of going through that action.
      - name: Set up Clang
        run: |
          choco install llvm --version=18.1.8 --no-progress -y --allow-downgrade
          echo "$env:ProgramFiles\LLVM\bin" >> $env:GITHUB_PATH

      - name: Set up MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1

      # vcvarsall.bat (run above) sets VCPKG_ROOT to the vcpkg bundled with
      # Visual Studio's own install on newer runner images, clobbering the
      # job-level env.VCPKG_ROOT - reassert ours so "Set up vcpkg" below
      # clones into a workspace-local, empty directory instead of VS's
      # (non-empty) one.
      - name: Reset VCPKG_ROOT
        run: echo "VCPKG_ROOT=$env:GITHUB_WORKSPACE\vcpkg" >> $env:GITHUB_ENV

      # vcpkg builds its C dependencies (FFmpeg excluded - see below) from
      # source on a cache miss, which is slow (protobuf/openssl/opus etc.
      # each take real time) - this cache is keyed on vcpkg.json and
      # VCPKG_TAG, so it invalidates both when a dependency is added/changed
      # and when the pinned vcpkg tool moves, rather than silently reusing
      # package binaries a different vcpkg version produced.
      - name: Cache vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\vcpkg\archives
          key: vcpkg-${{ runner.os }}-${{ env.VCPKG_TAG }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ env.VCPKG_TAG }}-

      - name: Set up vcpkg
        run: |
          git clone --branch "$env:VCPKG_TAG" --depth 1 https://github.com/microsoft/vcpkg "$env:VCPKG_ROOT"
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat"

      # chiaki-lib links FFmpeg directly (not vcpkg-managed - see
      # pybind/CMakeLists.txt) via deps/, which is gitignored/vendored
      # locally. Reproduce it here the same way scripts/setup.ps1 does for
      # local dev: a prebuilt shared Windows FFmpeg release. Only the
      # FFmpeg piece is needed - libplacebo/shaderc/SPIRV-Cross (also built
      # into deps/ locally) are chiaki-ng GUI-only, and the GUI is disabled
      # for chiaki-py's build (see CMakeLists.txt's CHIAKI_ENABLE_* set()s).
      - name: Fetch FFmpeg into deps/
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri "https://github.com/r52/FFmpeg-Builds/releases/download/latest/ffmpeg-n7.1-latest-win64-gpl-shared-7.1.zip" -OutFile ffmpeg.zip
          Expand-Archive -LiteralPath ffmpeg.zip -DestinationPath .
          Rename-Item "ffmpeg-n7.1-latest-win64-gpl-shared-7.1" "deps"
          Remove-Item ffmpeg.zip

      - name: Configure
        run: |
          $pythonExe = python -c "import sys; print(sys.executable)"
          # CMAKE_POLICY_VERSION_MINIMUM must be quoted: Windows PowerShell
          # mis-tokenizes an unquoted -DFOO=3.5-style argument into two argv
          # entries ("-DFOO=3" and ".5") when building a native command line,
          # silently truncating it to "3" - which every dependency further
          # down that needs this fallback (fmt, protobuf, sdl2, curl,
          # nanopb, chiaki-ng, pybind11, ...) then rejects with "Invalid
          # CMAKE_POLICY_VERSION_MINIMUM value \"3\"".
          cmake --fresh -S . -B build-release -G Ninja "-DCMAKE_POLICY_VERSION_MINIMUM=3.5" `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl `
            -DCMAKE_BUILD_TYPE=Release `
            -DPYTHON_EXECUTABLE="$pythonExe"

      - name: Build chiaki-py
        run: cmake --build build-release --config Release --target chiaki-py -- -j4

      - name: Build wheel + sdist
        run: python -m build

      - name: Check distributions
        run: python -m twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: dist/
          if-no-files-found: error
