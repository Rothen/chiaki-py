name: Windows tool paths

# Diagnostic only: sets up the same toolchain build-windows.yml uses, then
# prints where each tool resolves from and which version it is. Nothing is
# built or uploaded.
on:
  workflow_dispatch:

jobs:
  paths:
    name: Print tool paths and versions (windows-latest)
    runs-on: windows-latest
    env:
      PYTHON_VERSION: "3.11"
      VCPKG_ROOT: ${{ github.workspace }}\vcpkg
      VCPKG_TAG: "2026.07.29"

    defaults:
      run:
        shell: powershell

    steps:
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: "x64"

      - name: Install Python build/CI tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade protobuf build twine pybind11_stubgen

      - name: Set up Ninja
        run: choco install ninja --no-progress -y

      - name: Set up CMake
        run: |
          choco install cmake --version=4.4.3 --installargs "ADD_CMAKE_TO_PATH=System" --no-progress -y --allow-downgrade --force
          echo "$env:ProgramFiles\CMake\bin" >> $env:GITHUB_PATH

      - name: Set up Clang
        run: |
          choco install llvm --version=20.1.8 --no-progress -y --allow-downgrade
          echo "$env:ProgramFiles\LLVM\bin" >> $env:GITHUB_PATH

      - name: Set up MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Reset VCPKG_ROOT
        run: echo "VCPKG_ROOT=$env:GITHUB_WORKSPACE\vcpkg" >> $env:GITHUB_ENV

      - name: Set up vcpkg
        run: |
          git clone --branch "$env:VCPKG_TAG" --depth 1 https://github.com/microsoft/vcpkg "$env:VCPKG_ROOT"
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat"

      - name: Print tool paths and versions
        run: |
          # Lists every match on PATH (in resolution order, so the first one
          # is what a bare command name actually runs) and the version of
          # that first match. Seeing more than one path for a tool is how
          # a runner-image copy shadowing a pinned install shows up.
          function Show-Tool {
            param(
              [string]$Name,
              [string[]]$VersionArgs = @("--version"),
              [int]$Lines = 10
            )
            Write-Host ""
            Write-Host "=== $Name ==="
            $found = @(Get-Command $Name -All -CommandType Application -ErrorAction SilentlyContinue)
            if ($found.Count -eq 0) {
              Write-Host "NOT FOUND on PATH"
              return
            }
            Write-Host "Paths (first wins):"
            $found | ForEach-Object { Write-Host "  $($_.Source)" }
            Write-Host "Version (of first):"
            $ErrorActionPreference = "Continue"
            & $found[0].Source @VersionArgs 2>&1 | Select-Object -First $Lines | ForEach-Object { Write-Host "  $_" }
            $global:LASTEXITCODE = 0
          }

          Show-Tool python
          Show-Tool pip
          Show-Tool cmake
          Show-Tool ninja
          Show-Tool clang
          Show-Tool clang-cl
          Show-Tool lld-link
          Show-Tool cl -VersionArgs @("/?") -Lines 3
          Show-Tool link -VersionArgs @("/?") -Lines 3
          Show-Tool rc -VersionArgs @("/?") -Lines 3
          Show-Tool git
          Show-Tool choco -VersionArgs @("--version")

          # vcpkg isn't on PATH (the build invokes it via VCPKG_ROOT), so
          # print it directly instead of through Show-Tool.
          Write-Host ""
          Write-Host "=== vcpkg ==="
          Write-Host "Path: $env:VCPKG_ROOT\vcpkg.exe"
          & "$env:VCPKG_ROOT\vcpkg.exe" version
          $global:LASTEXITCODE = 0

          Write-Host ""
          Write-Host "=== Python packages ==="
          python -m pip list

          Write-Host ""
          Write-Host "=== Environment ==="
          foreach ($name in "VCPKG_ROOT", "VCINSTALLDIR", "VSINSTALLDIR", "VCToolsInstallDir", "WindowsSdkDir", "WindowsSDKVersion", "pythonLocation") {
            Write-Host ("{0} = {1}" -f $name, [Environment]::GetEnvironmentVariable($name))
          }

          Write-Host ""
          Write-Host "=== PATH (one per line, in order) ==="
          $env:PATH -split ";" | Where-Object { $_ } | ForEach-Object { Write-Host $_ }
