[project]
name = "chiaki-py"
version = "0.1.0"
description = "Python bindings and a Pythonic client library for PS4/PS5 Remote Play (chiaki-ng)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.5",
    "requests>=2.31",
    "pycryptodomex>=3.19",
    "PyQt6>=6.6",
    "PyQt6-WebEngine>=6.6",
    "dualsensepy>=0.2.2",
    "opencv-python>=5.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["chiaki_py", "chiaki_py.lib", "chiaki_py.lib.core", "chiaki_py.psn", "chiaki_py.controller"]

[tool.setuptools.package-data]
"*" = ["*.pyi", "*.pyd", "*.so", "*.dll"]
