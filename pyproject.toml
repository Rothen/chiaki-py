[project]
name = "chiaki-py"
# Derived from the git tag (vX.Y.Z) by setuptools-scm - see [tool.setuptools_scm].
dynamic = ["version"]
description = "Python bindings and a Pythonic client library for PS4/PS5 Remote Play (chiaki-ng)"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Benjamin Heuberger", email = "beni.heu@gmail.com" }]

requires-python = ">=3.11,<3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Topic :: Multimedia :: Video",
    "Topic :: Software Development :: Libraries",
]
keywords = ["playstation", "remote-play", "chiaki", "chiaki-ng", "ps4", "ps5", "streaming"]
dependencies = [
    "numpy>=2.4",
    "pydantic>=2",
    "requests>=2.31",
    "pycryptodomex>=3.19",
    "PyQt6>=6.6",
    "PyQt6-WebEngine>=6.6",
    "dualsense-py>=0.3.4",
    "platformdirs<=4.11.11",
    "cuda-python==13.4.1",
    "PyOpenGL==3.1.10"
]

[project.urls]
Homepage = "https://github.com/Rothen/chiaki-py"
Repository = "https://github.com/Rothen/chiaki-py"
Issues = "https://github.com/Rothen/chiaki-py/issues"

[build-system]
requires = ["setuptools>=69", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
local_scheme = "no-local-version"
fallback_version = "0.0.0"

[tool.setuptools]
packages = ["chiaki_py", "chiaki_py.lib", "chiaki_py.psn", "chiaki_py.controller", "chiaki_py.gui"]

[tool.setuptools.package-data]
"*" = ["*.pyi", "*.pyd", "*.so", "*.dll", "*.qml"]
"chiaki_py.gui" = ["favicon/*.ico", "favicon/*.png", "favicon/*.svg"]

[tool.pyright]
reportMissingTypeStubs = false
