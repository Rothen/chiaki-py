[project]
name = "chiaki-py"
version = "1.9.6"
description = "Python bindings and a Pythonic client library for PS4/PS5 Remote Play (chiaki-ng)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.23",
]

[project.optional-dependencies]
psn = [
    "requests>=2.31",
    "pycryptodomex>=3.19",
    "PyQt6>=6.6",
    "PyQt6-WebEngine>=6.6",
]
controller = [
    "dualsensepy",
]
gui = [
    "chiaki-py[psn]",
    "PyQt6>=6.6",
]
cv = [
    "opencv-python>=4.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["chiaki_py", "chiaki_py.lib", "chiaki_py.psn", "chiaki_py.controller"]

[tool.setuptools.package-data]
"*" = ["*.pyi"]
