[project]
name = "chiaki-py-client"
version = "1.9.6"
description = "A Pythonic client library for PS4/PS5 Remote Play, built on the chiaki_py native extension"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.23",
]

[project.optional-dependencies]
psn = [
    "requests>=2.31",
    "pycryptodomex>=3.19",
    "PyQt6>=6.6",
    "PyQt6-WebEngine>=6.6",
]
controller = [
    "ds_py",
]
gui = [
    "chiaki-py-client[psn]",
    "PyQt6>=6.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["chiaki_py_client", "chiaki_py_client.psn", "chiaki_py_client.controller"]

[tool.setuptools.package-data]
"*" = ["*.pyi"]
